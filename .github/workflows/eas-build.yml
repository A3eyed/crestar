name: EAS Production Builds

# Manual only — production mobile builds need Expo credentials and must not
# mark main red when a web-only deploy is in progress.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # eas-cli latest pulls @oclif/plugin-autocomplete which requires Node >= 22
          node-version: 22

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing."
            echo "Create an Expo access token at https://expo.dev/settings/access-tokens"
            echo "with access to the Crestar project, then add it as repo secret EXPO_TOKEN."
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Verify Expo identity
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -e
          echo "=== eas whoami ==="
          eas whoami
          echo "=== Project id from app.json ==="
          node -e "const a=require('./app.json'); const id=a.expo?.extra?.eas?.projectId; if(!id){console.error('MISSING projectId'); process.exit(1)}; console.log(id)"

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn install
        working-directory: .
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

      # project:info needs node_modules (resolves expo-router plugin)
      - name: Verify EAS project access
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -e
          eas project:info || {
            echo ""
            echo "ERROR: Cannot read EAS project. Check EXPO_TOKEN access on project b341ed25-1eb0-4fe4-8515-01f12cc4da20"
            exit 1
          }

      - name: Build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          eas build --platform ${{ inputs.platform }} --profile production --non-interactive
