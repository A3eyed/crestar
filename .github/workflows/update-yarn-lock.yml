name: Update yarn.lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-opennext

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Refresh yarn.lock
        run: yarn install

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet yarn.lock; then
            echo "yarn.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "chore: regenerate yarn.lock for OpenNext Cloudflare deps"
            git push
          fi
