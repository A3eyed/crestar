name: Update yarn.lock

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to update (must already exist)
        required: true
        default: fix/cloudflare-opennext

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn 4.12.0)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Refresh yarn.lock (mutable install — intentional)
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet yarn.lock; then
            echo "yarn.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add yarn.lock
            git commit -m "chore: regenerate yarn.lock for OpenNext Cloudflare deps"
            git push origin HEAD:${{ github.event.inputs.target_branch }}
          fi
