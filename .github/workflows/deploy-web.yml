name: Deploy web to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4.12.0)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version
          node --version

      - name: Decode brand assets
        run: node scripts/decode-brand-assets.mjs

      - name: Install dependencies
        env:
          # Yarn 4 defaults to immutable installs when CI=true
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install

      - name: Commit updated yarn.lock if changed
        run: |
          if git diff --quiet yarn.lock; then
            echo "yarn.lock unchanged"
          else
            git config user.name "crestar-ci"
            git config user.email "ci@crestarhq.com"
            git add yarn.lock
            git commit -m "chore: update yarn.lock for workspace deps"
            git push origin HEAD:main || echo "push skipped (permissions)"
          fi

      - name: Build OpenNext Worker
        working-directory: apps/web
        run: yarn cf:build
        env:
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          BETTER_AUTH_URL: https://crestarhq.com

      - name: Sanitize Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is missing"
            exit 1
          fi
          if [ -z "$RAW_ACCOUNT" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is missing"
            exit 1
          fi
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | xargs)
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '\r\n' | xargs)
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare
        working-directory: apps/web
        run: yarn cf:deploy
