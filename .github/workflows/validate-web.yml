name: Validate web (OpenNext)

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.github/workflows/validate-web.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4.12.0)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version
          node --version

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      - name: Typecheck web
        working-directory: apps/web
        run: yarn typecheck
        continue-on-error: true

      - name: OpenNext build (cf:build)
        working-directory: apps/web
        run: yarn cf:build
        env:
          BETTER_AUTH_URL: https://crestarhq.com

      - name: Confirm build artifacts
        run: |
          test -f apps/web/.open-next/worker.js
          test -d apps/web/.open-next/assets
          echo "OpenNext worker artifacts present"
